<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160">
  <style>
    .card{fill:#0d0615;stroke:#7c3aed;stroke-width:2;animation:glow 3s ease-in-out infinite}
    .icon{fill:#c084fc;animation:float 2.5s ease-in-out infinite}
    .t{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#fff;text-anchor:middle}
    .s{font:12px 'Segoe UI',Arial,sans-serif;fill:#c084fc;text-anchor:middle}
    .c2 .card,.c2 .icon{animation-delay:.4s}
    .c3 .card,.c3 .icon{animation-delay:.8s}
    .c4 .card,.c4 .icon{animation-delay:1.2s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes glow{0%,100%{stroke:#7c3aed}50%{stroke:#e9d5ff}}
  </style>
  <g class="c1"><rect class="card" x="10" y="10" width="190" height="140" rx="14"/>
    <path class="icon" d="M105 35 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <text class="t" x="105" y="108">AIML Student</text><text class="s" x="105" y="128">B.Tech CSE</text></g>
  <g class="c2"><rect class="card" x="220" y="10" width="190" height="140" rx="14"/>
    <path class="icon" d="M315 35 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <text class="t" x="315" y="108">Full-Stack Dev</text><text class="s" x="315" y="128">Next.js · NestJS</text></g>
  <g class="c3"><rect class="card" x="430" y="10" width="190" height="140" rx="14"/>
    <path class="icon" d="M525 35 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <text class="t" x="525" y="108">Open Source</text><text class="s" x="525" y="128">Contributor</text></g>
  <g class="c4"><rect class="card" x="640" y="10" width="190" height="140" rx="14"/>
    <path class="icon" d="M735 35 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z"/>
    <text class="t" x="735" y="108">Builder</text><text class="s" x="735" y="128">Ships projects</text></g>
</svg>
